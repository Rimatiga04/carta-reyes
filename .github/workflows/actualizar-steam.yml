name: Actualizar lista de Steam

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-steam.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/steam.json
          git diff --cached --quiet || git commit -m "Actualizar lista de deseados de Steam"
          git pull --rebase
          git push
